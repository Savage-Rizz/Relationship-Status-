<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Relationship Status Checker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: linear-gradient(to right, #ffecd2, #fcb69f);
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      padding: 20px;
      color: #333;
    }

    h1 {
      color: #e6005c;
      font-size: 28px;
      margin-bottom: 30px;
    }

    input, select, button {
      padding: 10px;
      margin: 10px 0;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      width: 80%;
      max-width: 150px;
    }

    #description {
      font-size: 13px;
      color: #555;
      margin-bottom: 20px;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 20px 0;
    }

    .status-row span {
      font-size: 22px;
      font-weight: bold;
    }

    button {
      background-color: #e6005c;
      color: white;
      cursor: pointer;
    }

    #result {
      margin-top: 30px;
      font-size: 20px;
    }

    .blink {
      animation: blink 1s infinite;
      font-size: 26px;
      color: #d60076;
      font-weight: bold;
      margin-top: 20px;
    }

    .float {
      animation: float 3s ease-in-out infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .bold-large {
      font-weight: bold;
      font-size: 22px;
      color: #222;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <h1>Find Your Relationship Status</h1>
  <input type="text" id="name" placeholder="Enter your name" required><br>
  <select id="gender" onchange="updateOptions()">
    <option value="" disabled selected>Select gender</option>
    <option value="female">Female</option>
    <option value="male">Male</option>
  </select>
  <div id="description">Note: There are only two genders.</div>

  <div class="status-row">
    <span>I have</span>
    <select id="status" style="display:none;">
      <option value="" disabled selected>Select status</option>
    </select>
  </div>

  <button onclick="checkStatus()">Check Status</button>
  <div id="result"></div>

  <script>
    function updateOptions() {
      const gender = document.getElementById("gender").value;
      const status = document.getElementById("status");
      status.style.display = "inline-block";
      status.innerHTML = '<option value="" disabled selected>Select status</option>';

      if (gender === "female") {
        status.innerHTML += '<option value="noone">No one</option>';
        status.innerHTML += '<option value="crush">A crush</option>';
        status.innerHTML += '<option value="boyfriend">A boyfriend</option>';
        status.innerHTML += '<option value="husband">A husband</option>';
      } else if (gender === "male") {
        status.innerHTML += '<option value="noone">No one</option>';
        status.innerHTML += '<option value="crush">A crush</option>';
        status.innerHTML += '<option value="girlfriend">A girlfriend</option>';
        status.innerHTML += '<option value="wife">A wife</option>';
      }
    }

    function checkStatus() {
      const gender = document.getElementById("gender").value;
      const status = document.getElementById("status").value;
      const result = document.getElementById("result");
      result.innerHTML = "";

      if (!gender || !status) {
        result.innerHTML = "Please select both gender and status.";
        return;
      }

      if ((status === "noone" || status === "crush") && gender === "female") {
        result.innerHTML = `
          <div class="blink float">system alert : Pretty Girl detected </div>
          <div id="loading" class="bold-large">Finding the best match for you...</div>
        `;
        setTimeout(() => {
          document.getElementById("loading").innerHTML = `
            <div class="bold-large">Best match for you!<br>Contact: <strong>9641568109</strong></div>
          `;
        }, 3000);
      } else if ((status === "noone" || status === "crush") && gender === "male") {
        result.innerHTML = `<div class="bold-large">You are a SIGMA boy. Stay strong, king.</div>`;
      } else if (status === "boyfriend" || status === "girlfriend") {
        result.innerHTML = `<div class="bold-large">You deserve better!</div>`;
      } else if (status === "husband" || status === "wife") {
        result.innerHTML = `<div class="bold-large">Oh my god, you are in danger!</div>`;
      }
    }
  </script>
